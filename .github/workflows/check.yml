name: 检查记录

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs --check
      - run: node scripts/check-accounts.mjs --self-test
      - run: node scripts/find-iphone-giveaways.mjs --self-test
